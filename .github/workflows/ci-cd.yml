name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Client - install, lint, typecheck, test, build
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      # Testcontainers starts Postgres in Docker, which ubuntu runners provide.
      - name: API - test
        run: dotnet test

      - name: Publish
        run: |
          dotnet publish api -c Release -o publish
          mkdir -p publish/wwwroot
          cp -r client/dist/. publish/wwwroot/

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: publish

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: personligfinans-ds
          package: publish
